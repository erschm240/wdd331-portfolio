<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clip Path and Mask Image</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Clip Path and Mask</h1>
    <h2>Clip Path</h1>
    <div class="cards">
        <div class="card">
            <img src="images/park.jpg" alt="A park with a city skyline behind it">
        </div>
        <div class="card">
            <img class="clip-circle transition" src="images/park.jpg" alt="A park with a city skyline behind it">
        </div>
        <div class="card">
            <img class="clip-polygon broken-transition" src="images/park.jpg" alt="A park with a city skyline behind it">
        </div>
        <div class="card">
            <img class="clip-ellipse" src="images/park.jpg" alt="A park with a city skyline behind it">
        </div>
    </div>
    <h2>Mask Image</h2>
    <div class="cards">
        <div class="card">
            <img src="images/park.jpg" alt="A park with a city skyline behind it">
        </div>
        <div class="card">
            <img class="mask" src="images/park.jpg" alt="A park with a city skyline behind it">
        </div>
    </div>
</body>
</html>
