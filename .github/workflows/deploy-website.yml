name: Deploy Website

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs: 
  deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps: 
      - name: checkout
        uses: actions/checkout@v6

      - name: deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: website
          clean: true